name: Build & Release Desktop Apps (macOS, Windows, Linux)

on:
  # Release every time a pull request is merged into main
  pull_request:
    types: [closed]
    branches:
      - main
  # Build-only (no release) test runs
  push:
    branches:
      - standealone
  workflow_dispatch:

jobs:
  build:
    # For pull requests, only run when the PR was actually merged (not just closed)
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # On merged PRs, build exactly the merge commit
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Desktop Binaries (retry on transient download errors)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if npm run dist:${{ matrix.platform }}; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "All build attempts failed"
          exit 1

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refinedocs-${{ matrix.platform }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # Only publish after a merged PR into main, and only if all 3 platforms built
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Unique, ordered tag per merge, e.g. v1.0.42
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: Refinedocs v1.0.${{ github.run_number }} (Preview)
          prerelease: true
          body: |
            ## ${{ github.event.pull_request.title }}

            Merged pull request #${{ github.event.pull_request.number }} by @${{ github.event.pull_request.user.login }}.

            > [!WARNING]
            > **Experimental Desktop Preview Notice:**
            > - **Not Yet Fully Stable**: These downloadable desktop versions are in early preview and may encounter unexpected bugs or crashes.
            > - **Unsigned Binaries**: The current builds do not yet have valid code-signing certificates for the various platforms. You may see security prompts such as macOS Gatekeeper ("Apple cannot verify...") or Windows SmartScreen ("Windows protected your PC"). 
            >   - *macOS*: Right-click (Control-click) the app icon and select **Open**, or run `sudo xattr -rd com.apple.quarantine /Applications/Refinedocs.app`.
            >   - *Windows*: Click **More info** -> **Run anyway**.
            > - **Performance / Speed**: Running on desktop is currently still slower and heavier than using the web version while we continue optimizing the standalone background runtime and bundle footprint.

            ### Downloads
            - **macOS**: `.dmg` / `.zip` (Apple Silicon & Intel)
            - **Windows**: `.exe` installer / portable
            - **Linux**: `.AppImage` / `.deb`
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
